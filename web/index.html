function search(q) {
  const words = q.toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(w => w.length > 1);
  if (!words.length) return [];
  return S.map(s => {
    const kw = s.kw.split(' '), hay = (s.title + ' ' + s.answer).toLowerCase();
    let score = 0;
    for (const w of words) {
      if (kw.includes(w)) score += 5;
      else if (kw.some(k => k.startsWith(w))) score += 3;
      else if (hay.includes(w)) score += 1;
    }
    return [s, score];
  }).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).map(x => x[0]);
}

function toggleDone(id) { const it = item(id); if (it) { it.doneAt = it.doneAt ? null : new Date().toISOString(); saveAll(plan); } }
function removeFromPlan(id) { plan = plan.filter(p => p.serviceID !== id); saveAll(plan); }

    const r = search(st.query);
    if (!r.length) return `<div class="group"><div class="empty"><b>No results for "${esc(st.query)}"</b>Try another word, or ask a person.</div><a class="row plain link" href="sms:6138015603">Text a librarian: 613-801-5603</a></div>`;
    return `<div class="group">${r.map(serviceRow).join('')}</div>`;
  }
  return `<div class="group"><button class="row" data-deck="1">${tile('spark','brand')}<span class="grow"><div>Discover What's Here</div><div class="sub">${DISCOVER.length} quick cards, under a minute</div></span>${chev}</button></div><div class="spacer"></div>
    <h2 class="sec-title">Most Needed</h2><div class="group">${QUICK.map(id => serviceRow(byId(id))).join('')}</div><div class="spacer"></div>
    <h2 class="sec-title">More Services</h2><div class="group">${S.filter(s => !QUICK.includes(s.id)).map(serviceRow).join('')}</div>
    <p class="foot" style="margin-top:12px">Student prototype. Not affiliated with or endorsed by the University of Ottawa.</p>`;
}
function viewFind() {
  return `<div class="nav"></div><h1>Library</h1>
    <label class="search">${svg('search',18)}<input id="q" type="search" placeholder="Camera, citing, study room…" aria-label="Search Library services" value="${esc(st.query)}" autocomplete="off" autocorrect="off" enterkeyhint="search"></label>
    <div id="results" aria-live="polite">${findBody()}</div>`;
}
function viewDetail(id) {
  const s = byId(id), it = item(id);
  return `<div class="nav"><button class="back" data-back="1">${svg('left',22)}Back</button></div>
    <div class="group"><div class="row plain" style="align-items:flex-start">${tile(s.icon,s.color,'big')}<span class="grow"><div style="font-size:20px;font-weight:600">${esc(s.title)}</div><div class="sub">${esc(s.answer)}</div></span></div>
    <a class="row plain link" href="${esc(s.url)}" target="_blank" rel="noopener"><span class="grow">${esc(s.cta)}</span>${svg('ext',16)}</a></div><div class="spacer"></div>
    ${s.facts.length ? `<h2 class="sec-title">Good to Know</h2><div class="group">${s.facts.map(factRow).join('')}</div><div class="spacer"></div>` : ''}
    <h2 class="sec-title">How It Works</h2><div class="group">${s.steps.map((t,i) => `<div class="row plain"><span class="num">${i+1}</span><span class="grow">${esc(t)}</span></div>`).join('')}</div><div class="spacer"></div>
    <div class="group">${it ? `<button class="row plain link" data-done="${id}">${it.doneAt ? 'Mark as Not Done' : 'Mark as Done'}</button><button class="row plain danger" data-remove="${id}">Remove from My Plan</button>` : `<button class="row plain link" data-add="${id}">Add to My Plan</button>`}</div>
    <p class="foot">On the website: ${s.clicks} ${s.clicks === 1 ? 'click' : 'clicks'} from the Library home page. Here: the answer is on the first screen.</p>`;
}
function viewBorrow() {
  const cam = byId('camera');
  return `<div class="nav"></div><h1>Borrow</h1>
    <h2 class="sec-title">Multimedia Equipment</h2><div class="group">${GEAR.map(([i,n,c]) => `<a class="row" href="${esc(GEAR_URL)}" target="_blank" rel="noopener">${tile(i,c)}<span class="grow">${esc(n)}</span>${ext}</a>`).join('')}</div>
    <p class="foot">Opens the Library's official list, where you can check availability.</p>
    <h2 class="sec-title">Loan Rules</h2><div class="group">${cam.facts.map(factRow).join('')}</div><div class="spacer"></div>
    <div class="group"><button class="row plain" data-open="camera"><span class="grow">How Borrowing Works</span>${chev}</button></div><div class="spacer"></div>
    <h2 class="sec-title">Also Borrow</h2><div class="group">${serviceRow(byId('books'))}</div>`;
}
function viewAsk() {
  const lines = st.chat.map(m => m.me
    ? `<div class="bubble me">${esc(m.text)}</div>`
    : `<div class="bubble them">${esc(m.text)}</div><div class="src">Answered by ${esc(m.source)}</div>${m.service ? `<div class="group" style="width:100%">${serviceRow(byId(m.service))}</div>` : ''}`).join('');
  return `<div class="nav"></div><h1>Ask</h1>
    ${st.chat.length ? '' : PROMPTS.map(p => `<button class="chip" data-prompt="${esc(p)}">${esc(p)}</button>`).join('') + `<p class="foot" style="margin:12px 4px">Questions are matched against Library facts. If AI is switched on, they go to DeepSeek with emails and phone or ID numbers removed first. Nothing is saved.</p>`}
    <div class="chat" aria-live="polite">${lines}${st.thinking ? '<div class="bubble them">Looking that up…</div>' : ''}</div><div class="ask-pad"></div>`;
}
function viewPlan() {
  const done = plan.filter(p => p.doneAt), todo = plan.filter(p => !p.doneAt);
  const saved = done.reduce((n,p) => n + Math.max((byId(p.serviceID)?.clicks || 1) - 1, 0), 0);
  const row = p => { const s = byId(p.serviceID); if (!s) return ''; return `<div class="row"><button class="check ${p.doneAt ? 'on':''}" data-done="${s.id}" aria-label="${p.doneAt ? 'Mark '+esc(s.title)+' as not done' : 'Mark '+esc(s.title)+' as done'}">${p.doneAt ? svg('check',16) : ''}</button><button class="grow ${p.doneAt ? 'struck':''}" data-open="${s.id}" style="min-height:28px">${esc(s.title)}</button><button class="danger" data-remove="${s.id}" style="font-size:15px;min-height:28px">Remove</button></div>`; };
  return `<div class="nav"></div><h1>My Plan</h1>
    ${plan.length ? `<div class="group"><div class="row plain" style="display:block"><div>${done.length} of ${plan.length} done</div><div class="progress"><i style="width:${plan.length ? done.length/plan.length*100 : 0}%"></i></div></div><div class="row plain"><span class="grow">Website clicks saved</span><span class="value">${saved}</span></div></div><div class="spacer"></div>
    ${todo.length ? `<h2 class="sec-title">To Do</h2><div class="group">${todo.map(row).join('')}</div><div class="spacer"></div>` : ''}
    ${done.length ? `<h2 class="sec-title">Done</h2><div class="group">${done.map(row).join('')}</div><div class="spacer"></div>` : ''}`
    : `<div class="group"><div class="empty"><b>Nothing Saved Yet</b>Add a service from Find and it shows up here.</div></div><div class="spacer"></div>`}
    <h2 class="sec-title">Contact the Library</h2><div class="group"><a class="row plain link" href="sms:6138015603">Text 613-801-5603</a><a class="row plain link" href="tel:6135625213">Call 613-562-5213</a><a class="row plain link" href="mailto:bibliolibrary@uOttawa.ca">bibliolibrary@uOttawa.ca</a></div><div class="spacer"></div>
    <div class="group"><button class="row plain" data-open-data="1"><span class="grow">Your Data</span>${chev}</button></div>
    <p class="foot">Student prototype. Not affiliated with or endorsed by the University of Ottawa.</p>`;
}
function viewData() {
  return `<div class="nav"><button class="back" data-back="1">${svg('left',22)}Back</button></div><h1>Your Data</h1>
    <h2 class="sec-title">Stored in This Browser</h2><div class="group">${[['Saved items',plan.length],['serviceID','Which service'],['source','Where you added it'],['addedAt','Date added'],['doneAt','Date finished']].map(factRow).join('')}</div>
    <p class="foot">One small list in this browser's local storage. It has no account behind it.</p>
    <h2 class="sec-title">Never Collected</h2><div class="group">${['Name, email or student number','Library account or password','Location or analytics','Chat history'].map(t => `<div class="row plain">${esc(t)}</div>`).join('')}</div><div class="spacer"></div>
    <h2 class="sec-title">What Leaves This Device</h2><div class="group"><div class="row plain sub" style="margin:0">Questions you type in Ask go to this site's server, and to DeepSeek if AI is switched on, with emails and phone or ID numbers removed first. They aren't saved. Official pages you open follow the Library's own privacy notice.</div></div><div class="spacer"></div>
    <div class="group"><button class="row plain danger" data-erase="1">Erase Everything</button></div><div class="spacer"></div>`;
}

function render() {
  if (!onboarded) { renderWelcome(); return; }
  $tabs.hidden = false;
  const top = st.stack[st.stack.length - 1];
  $app.className = '';
  $app.innerHTML = top === 'data' ? viewData() : top ? viewDetail(top)
    : st.tab === 'find' ? viewFind() : st.tab === 'borrow' ? viewBorrow() : st.tab === 'ask' ? viewAsk() : viewPlan();
  $tabs.innerHTML = `<div>${[['find','search','Find'],['borrow','camera','Borrow'],['ask','chat','Ask'],['plan','list','My Plan']].map(([k,i,l]) => `<button data-tab="${k}" ${st.tab===k ? 'aria-current="page"':''}>${svg(i)}${l}</button>`).join('')}</div>`;
  $composer.innerHTML = (st.tab === 'ask' && !top) ? `<div class="composer"><form id="askf"><input id="askq" placeholder="Ask about the Library" aria-label="Ask about the Library" maxlength="300" autocomplete="off"><button aria-label="Send" ${st.thinking?'disabled':''}>${svg('up',20)}</button></form></div>` : '';
  if (st.tab === 'ask') scrollTo(0, document.body.scrollHeight);
}
function renderWelcome() {
  $tabs.hidden = true; $composer.innerHTML = '';
  $app.innerHTML = `<div class="welcome"><div style="flex:1"><div class="center">${tile('books','brand','huge')}</div><h1>Welcome to<br>First Chapter</h1>
    ${[['search','Find it fast','Study rooms, citation help, printing and more.'],['camera','Borrow gear','Cameras, mics and tripods, and how to get them.'],['lock','No login','Your plan stays in this browser.']].map(([i,t,b]) => `<div class="feature">${svg(i)}<span><b>${t}</b><span class="sub">${b}</span></span></div>`).join('')}</div>
    <button class="btn pri" data-deck="1">Show Me What's Here</button><button class="btn txt" data-skip="1">Skip</button>
    <p class="foot center" style="margin:12px 0 0">Student prototype. Not affiliated with or endorsed by the University of Ottawa.</p></div>`;
}

// Swipe deck: you can't search for a service you don't know exists.
let deckIdx = 0, deckBusy = false;
function openDeck() { deckIdx = 0; deckBusy = false; drawDeck(); }
function closeDeck() { $overlay.innerHTML = ''; if (!onboarded) setOnboarded(true); render(); }
function drawDeck() {
  if (deckIdx >= DISCOVER.length) { closeDeck(); return; }
  const card = s => `${tile(s.icon,s.color,'big')}<h2>${esc(s.title)}</h2><p>${esc(s.answer)}</p>`;
  const s = byId(DISCOVER[deckIdx]), next = byId(DISCOVER[deckIdx+1]);
  $overlay.innerHTML = `<div class="deck" role="dialog" aria-label="Discover Library services"><div class="deck-in">
    <div class="deck-top"><span></span><span>${deckIdx+1} of ${DISCOVER.length}</span><button data-deck-done="1">Done</button></div>
    <div class="deck-hint">Swipe right to add to your plan, left to skip.</div>
    <div class="deck-stage">${next ? `<div class="deck-card" style="transform:scale(.95)" aria-hidden="true">${card(next)}</div>` : ''}<div class="deck-card" id="top">${card(s)}</div></div>
    <div class="deck-btns"><button class="btn sec" data-deck-no="1">Not Now</button><button class="btn pri" data-deck-yes="1">Add to Plan</button></div></div></div>`;
  const el = document.getElementById('top'); let x0 = null, dx = 0;
  el.addEventListener('pointerdown', e => { x0 = e.clientX; dx = 0; el.setPointerCapture(e.pointerId); el.style.transition = 'none'; });
  el.addEventListener('pointermove', e => { if (x0 === null) return; dx = e.clientX - x0; el.style.transform = `translateX(${dx}px) rotate(${dx/24}deg)`; });
  const end = () => { if (x0 === null) return; x0 = null; if (Math.abs(dx) > 90) deckDecide(dx > 0); else { el.style.transition = 'transform .2s'; el.style.transform = ''; } };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
function deckDecide(keep) {
  if (deckBusy || deckIdx >= DISCOVER.length) return;
  deckBusy = true;
  if (keep) addToPlan(DISCOVER[deckIdx], 'swipe');
  const el = document.getElementById('top');
  el.style.transition = 'transform .25s ease-out';
  el.style.transform = `translateX(${keep ? 620 : -620}px) rotate(${keep ? 14 : -14}deg)`;
  setTimeout(() => { deckIdx++; deckBusy = false; drawDeck(); }, 250);
}

// Assistant: a small server function calls DeepSeek if a key is set; otherwise local search answers.
function redact(t) { return t.replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g,'[removed]').replace(/\+?\d[\d\s().-]{5,}\d/g,'[removed]'); }
async function ask(q) {
  q = q.trim(); if (!q || st.thinking) return;
  st.chat.push({me:true, text:q}); st.thinking = true; render();
  const local = search(q)[0];
  let reply = null;
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 15000);
    const r = await fetch('/api/ask', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question:redact(q)}), signal:ctl.signal});
    clearTimeout(t);
    if (r.ok) { const d = await r.json(); if (d.text) reply = {text:d.text, source:'DeepSeek', service: byId(d.service) ? d.service : local?.id}; }
  } catch {}
  if (!reply) reply = local
    ? {text:local.answer, source:'Library search', service:local.id}
    : {text:"I couldn't match that to a Library service. A librarian can help: text 613-801-5603.", source:'Library search', service:'librarian'};
  st.chat.push(reply); st.thinking = false; render();
  document.getElementById('askq')?.focus();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-tab],[data-open],[data-back],[data-add],[data-done],[data-remove],[data-deck],[data-skip],[data-deck-done],[data-deck-no],[data-deck-yes],[data-prompt],[data-open-data],[data-erase]');
  if (!b) return;
  const d = b.dataset;
  if (d.tab) { st.tab = d.tab; st.stack = []; render(); scrollTo(0,0); }
  else if (d.open) { st.stack.push(d.open); render(); scrollTo(0,0); }
  else if (d.back) { st.stack.pop(); render(); scrollTo(0,0); }
  else if (d.add) { addToPlan(d.add,'find'); render(); }
  else if (d.done) { toggleDone(d.done); render(); }
  else if (d.remove) { removeFromPlan(d.remove); render(); }
  else if (d.deck) openDeck();
  else if (d.skip) { setOnboarded(true); render(); }
  else if (d.deckDone) closeDeck();
  else if (d.deckNo) deckDecide(false);
  else if (d.deckYes) deckDecide(true);
  else if (d.prompt) ask(d.prompt);
  else if (d.openData) { st.stack.push('data'); render(); scrollTo(0,0); }
  else if (d.erase) {
    if (confirm("Erase your plan from this browser? This can't be undone.")) {
      plan = []; saveAll(plan); setOnboarded(false); st.chat = []; st.stack = []; st.tab = 'find'; render();
    }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { st.query = e.target.value; document.getElementById('results').innerHTML = findBody(); }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'askf') { e.preventDefault(); const i = document.getElementById('askq'); ask(i.value); }
});
render();
</script>
</body>
