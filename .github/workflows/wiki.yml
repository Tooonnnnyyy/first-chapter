name: Wiki navigation
on:
  push:
    branches: [main]
    paths: ['README.md', 'docs/**', 'scripts/maintenance/export_wiki.py', '.github/workflows/wiki.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/maintenance/export_wiki.py wiki-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiki-pages
          path: wiki-output/
          retention-days: 14
      - name: Sync when a dedicated Wiki token is configured
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo 'Wiki pages generated. WIKI_TOKEN is not configured; see docs/en/maintenance.md.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          askpass="$RUNNER_TEMP/wiki-askpass.sh"
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) echo x-access-token;; *) printf "%s\n" "$WIKI_TOKEN";; esac' > "$askpass"
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          trap 'rm -f "$askpass"' EXIT
          git clone "https://github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          cp wiki-output/*.md "$RUNNER_TEMP/wiki/"
          cd "$RUNNER_TEMP/wiki"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.md'
          if ! git diff --cached --quiet; then
            git commit -m 'docs: sync Wiki navigation'
            git push
          fi
