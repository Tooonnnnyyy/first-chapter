version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /archive/geeguide-web
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      archive-dependencies:
        patterns: ['*']
