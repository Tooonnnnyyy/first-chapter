name: Translation / Traduction / 翻译
description: Improve English, French or Simplified Chinese documentation.
title: "[i18n] "
labels: [documentation, "area:i18n", "status:triage"]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language / Langue / 语言
      options: [English, Français, 简体中文]
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File or page / Fichier ou page / 文件或页面
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Suggested correction / Correction proposée / 修改建议
    validations:
      required: true
