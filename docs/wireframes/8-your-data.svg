<svg xmlns="http://www.w3.org/2000/svg" width="420" height="800" viewBox="0 0 420 800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="420" height="800" rx="0" fill="#fafafa"/><circle cx="73" cy="36" r="14" fill="#18181b" stroke="#18181b" stroke-width="1.5"/><text x="73" y="41" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">8</text><text x="96" y="43" font-size="21" font-weight="700" fill="#18181b" text-anchor="start">Your Data</text><rect x="60" y="66" width="300" height="620" rx="38" fill="#ffffff" stroke="#18181b" stroke-width="3"/><rect x="172" y="78" width="76" height="20" rx="10" fill="#18181b"/><text x="76" y="126" font-size="14" font-weight="500" fill="#8f0019" text-anchor="start">‹ My Plan</text><text x="234.0" y="126" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">Your Data</text><text x="78" y="152" font-size="10.5" font-weight="600" fill="#71717a" text-anchor="start">STORED ON THIS PHONE</text><rect x="74" y="160" width="272" height="145" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/><text x="86" y="178.5" font-size="12.5" font-weight="400" fill="#18181b" text-anchor="start">Saved items</text><text x="334" y="178.5" font-size="12" font-weight="400" fill="#71717a" text-anchor="end">3</text><line x1="86" y1="189" x2="346" y2="189" stroke="#d4d4d8" stroke-width="1"/><text x="86" y="207.5" font-size="12.5" font-weight="400" fill="#18181b" text-anchor="start">serviceID</text><text x="334" y="207.5" font-size="12" font-weight="400" fill="#71717a" text-anchor="end">Which service</text><line x1="86" y1="218" x2="346" y2="218" stroke="#d4d4d8" stroke-width="1"/><text x="86" y="236.5" font-size="12.5" font-weight="400" fill="#18181b" text-anchor="start">source</text><text x="334" y="236.5" font-size="12" font-weight="400" fill="#71717a" text-anchor="end">Where you added it</text><line x1="86" y1="247" x2="346" y2="247" stroke="#d4d4d8" stroke-width="1"/><text x="86" y="265.5" font-size="12.5" font-weight="400" fill="#18181b" text-anchor="start">addedAt</text><text x="334" y="265.5" font-size="12" font-weight="400" fill="#71717a" text-anchor="end">Date added</text><line x1="86" y1="276" x2="346" y2="276" stroke="#d4d4d8" stroke-width="1"/><text x="86" y="294.5" font-size="12.5" font-weight="400" fill="#18181b" text-anchor="start">doneAt</text><text x="334" y="294.5" font-size="12" font-weight="400" fill="#71717a" text-anchor="end">Date finished</text><text x="78" y="324" font-size="10.5" font-weight="600" fill="#71717a" text-anchor="start">NEVER COLLECTED</text><rect x="74" y="332" width="272" height="108" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/><text x="86" y="349.5" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">Name, email or student number</text><line x1="86" y1="359" x2="346" y2="359" stroke="#d4d4d8" stroke-width="1"/><text x="86" y="376.5" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">Library account or password</text><line x1="86" y1="386" x2="346" y2="386" stroke="#d4d4d8" stroke-width="1"/><text x="86" y="403.5" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">Location or analytics</text><line x1="86" y1="413" x2="346" y2="413" stroke="#d4d4d8" stroke-width="1"/><text x="86" y="430.5" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">Chat history</text><text x="78" y="458" font-size="10.5" font-weight="600" fill="#71717a" text-anchor="start">WHAT LEAVES THIS PHONE</text><rect x="74" y="466" width="272" height="68" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/><text x="86" y="486" font-size="11.5" font-weight="400" fill="#3f3f46" text-anchor="start">Nothing, unless Online AI is on. Then only</text><text x="86" y="503" font-size="11.5" font-weight="400" fill="#3f3f46" text-anchor="start">typed questions, with emails and phone</text><text x="86" y="520" font-size="11.5" font-weight="400" fill="#3f3f46" text-anchor="start">or ID numbers removed first.</text><rect x="74" y="546" width="272" height="40" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/><text x="210.0" y="571" font-size="13.5" font-weight="600" fill="#8f0019" text-anchor="middle">Erase Everything</text><line x1="62" y1="632" x2="358" y2="632" stroke="#d4d4d8" stroke-width="1"/><circle cx="97.5" cy="650" r="8" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="97.5" y="672" font-size="10" font-weight="400" fill="#71717a" text-anchor="middle">Find</text><circle cx="172.5" cy="650" r="8" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="172.5" y="672" font-size="10" font-weight="400" fill="#71717a" text-anchor="middle">Borrow</text><circle cx="247.5" cy="650" r="8" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="247.5" y="672" font-size="10" font-weight="400" fill="#71717a" text-anchor="middle">Ask</text><circle cx="322.5" cy="650" r="8" fill="#8f0019" stroke="#8f0019" stroke-width="1.5"/><text x="322.5" y="672" font-size="10" font-weight="700" fill="#8f0019" text-anchor="middle">My Plan</text><text x="60" y="716" font-size="14.5" font-weight="400" fill="#3f3f46" text-anchor="start">Every stored field is shown. One button</text><text x="60" y="737" font-size="14.5" font-weight="400" fill="#3f3f46" text-anchor="start">erases the plan.</text></svg>