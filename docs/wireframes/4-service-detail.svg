<svg xmlns="http://www.w3.org/2000/svg" width="420" height="800" viewBox="0 0 420 800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="420" height="800" rx="0" fill="#fafafa"/><circle cx="73" cy="36" r="14" fill="#18181b" stroke="#18181b" stroke-width="1.5"/><text x="73" y="41" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="96" y="43" font-size="21" font-weight="700" fill="#18181b" text-anchor="start">Service detail</text><rect x="60" y="66" width="300" height="620" rx="38" fill="#ffffff" stroke="#18181b" stroke-width="3"/><rect x="172" y="78" width="76" height="20" rx="10" fill="#18181b"/><text x="76" y="126" font-size="14" font-weight="500" fill="#8f0019" text-anchor="start">‹ Back</text><text x="338" y="126" font-size="13" font-weight="500" fill="#8f0019" text-anchor="end">Share</text><rect x="76" y="140" width="44" height="44" rx="8.8" fill="#e4e4e7" stroke="#a1a1aa" stroke-width="1"/><line x1="83.92" y1="147.92" x2="112.08" y2="176.07999999999998" stroke="#a1a1aa" stroke-width="1"/><line x1="112.08" y1="147.92" x2="83.92" y2="176.07999999999998" stroke="#a1a1aa" stroke-width="1"/><text x="130" y="156" font-size="14" font-weight="700" fill="#18181b" text-anchor="start">Borrow a Camera or Gear</text><text x="130" y="174" font-size="11" font-weight="400" fill="#71717a" text-anchor="start">Cameras, mics, tripods, lights.</text><text x="130" y="189" font-size="11" font-weight="400" fill="#71717a" text-anchor="start">7-day loan, Morisset desk.</text><rect x="74" y="202" width="272" height="36" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/><text x="86" y="225" font-size="13" font-weight="600" fill="#8f0019" text-anchor="start">See Equipment List</text><text x="334" y="225" font-size="14" font-weight="600" fill="#8f0019" text-anchor="end">↗</text><text x="78" y="258" font-size="10.5" font-weight="600" fill="#71717a" text-anchor="start">GOOD TO KNOW</text><rect x="74" y="266" width="272" height="96" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/><text x="86" y="286.0" font-size="12.5" font-weight="400" fill="#18181b" text-anchor="start">Loan</text><text x="334" y="286.0" font-size="12" font-weight="400" fill="#71717a" text-anchor="end">7 days, 2 renewals</text><line x1="86" y1="298" x2="346" y2="298" stroke="#d4d4d8" stroke-width="1"/><text x="86" y="318.0" font-size="12.5" font-weight="400" fill="#18181b" text-anchor="start">Pick up</text><text x="334" y="318.0" font-size="12" font-weight="400" fill="#71717a" text-anchor="end">Morisset service desk</text><line x1="86" y1="330" x2="346" y2="330" stroke="#d4d4d8" stroke-width="1"/><text x="86" y="350.0" font-size="12.5" font-weight="400" fill="#18181b" text-anchor="start">Bring</text><text x="334" y="350.0" font-size="12" font-weight="400" fill="#71717a" text-anchor="end">Valid library card</text><text x="78" y="380" font-size="10.5" font-weight="600" fill="#71717a" text-anchor="start">HOW IT WORKS</text><rect x="74" y="388" width="272" height="102" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/><circle cx="96" cy="405" r="9" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="96" y="409" font-size="10.5" font-weight="600" fill="#18181b" text-anchor="middle">1</text><text x="114" y="409" font-size="12.5" font-weight="400" fill="#18181b" text-anchor="start">Pick your gear from the list</text><line x1="86" y1="422" x2="346" y2="422" stroke="#d4d4d8" stroke-width="1"/><circle cx="96" cy="439" r="9" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="96" y="443" font-size="10.5" font-weight="600" fill="#18181b" text-anchor="middle">2</text><text x="114" y="443" font-size="12.5" font-weight="400" fill="#18181b" text-anchor="start">Bring your card to the desk</text><line x1="86" y1="456" x2="346" y2="456" stroke="#d4d4d8" stroke-width="1"/><circle cx="96" cy="473" r="9" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="96" y="477" font-size="10.5" font-weight="600" fill="#18181b" text-anchor="middle">3</text><text x="114" y="477" font-size="12.5" font-weight="400" fill="#18181b" text-anchor="start">Return or renew within 7 days</text><rect x="74" y="500" width="272" height="36" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/><text x="86" y="523" font-size="13" font-weight="600" fill="#8f0019" text-anchor="start">Add to My Plan</text><text x="78" y="556" font-size="10.5" font-weight="400" fill="#71717a" text-anchor="start">Website: about 5 clicks. Here: answer on the first</text><text x="78" y="571" font-size="10.5" font-weight="400" fill="#71717a" text-anchor="start">screen.</text><line x1="62" y1="632" x2="358" y2="632" stroke="#d4d4d8" stroke-width="1"/><circle cx="97.5" cy="650" r="8" fill="#8f0019" stroke="#8f0019" stroke-width="1.5"/><text x="97.5" y="672" font-size="10" font-weight="700" fill="#8f0019" text-anchor="middle">Find</text><circle cx="172.5" cy="650" r="8" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="172.5" y="672" font-size="10" font-weight="400" fill="#71717a" text-anchor="middle">Borrow</text><circle cx="247.5" cy="650" r="8" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="247.5" y="672" font-size="10" font-weight="400" fill="#71717a" text-anchor="middle">Ask</text><circle cx="322.5" cy="650" r="8" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="322.5" y="672" font-size="10" font-weight="400" fill="#71717a" text-anchor="middle">My Plan</text><text x="60" y="716" font-size="14.5" font-weight="400" fill="#3f3f46" text-anchor="start">Facts first, then one tap to the official</text><text x="60" y="737" font-size="14.5" font-weight="400" fill="#3f3f46" text-anchor="start">Library page. Also opens from Borrow, Ask</text><text x="60" y="758" font-size="14.5" font-weight="400" fill="#3f3f46" text-anchor="start">and My Plan.</text></svg>